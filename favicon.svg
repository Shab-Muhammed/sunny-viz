<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Graphite Slate -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15171e"/>
      <stop offset="60%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <!-- Incandescent Border Gradient -->
    <linearGradient id="border" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c56"/>
      <stop offset="50%" stop-color="#ffbe76"/>
      <stop offset="100%" stop-color="#4ecdc4"/>
    </linearGradient>

    <!-- Warm Ember Glow (Lower Left) -->
    <radialGradient id="ember" cx="20%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#ff7a29" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#f39c56" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Sun Ray Glow (Top Right) -->
    <radialGradient id="sun" cx="85%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#fff4d0" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ffbe76" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Luminous Letters Gradient -->
    <linearGradient id="textLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff0d4"/>
      <stop offset="100%" stop-color="#ffd599"/>
    </linearGradient>

    <!-- Incandescent 8 / Infinity Reel Gradient -->
    <linearGradient id="amber8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6b8"/>
      <stop offset="35%" stop-color="#ffbe76"/>
      <stop offset="75%" stop-color="#f39c56"/>
      <stop offset="100%" stop-color="#e17055"/>
    </linearGradient>

    <!-- VIZ Pill Badge Gradient -->
    <linearGradient id="vizPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f39c56" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Soft Drop Shadow for high contrast -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Amber Bloom Glow -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  
  <!-- Atmospheric Lighting Radiance -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ember)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#sun)"/>
  
  <!-- Sleek Glowing Rim -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="url(#border)" stroke-width="1.6"/>

  <!-- Top Right Scintillation Motes -->
  <circle cx="51" cy="11" r="1.2" fill="#ffffff" opacity="0.85"/>
  <circle cx="56" cy="15" r="0.8" fill="#ffbe76" opacity="0.7"/>

  <!-- Hero Content Group -->
  <g filter="url(#cardShadow)">
    <!-- Primary Mark: "gr8" -->
    <!-- "gr" in bold luminous modern typography -->
    <text x="12" y="36.5"
          font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="26"
          font-weight="900"
          letter-spacing="-1.2"
          fill="url(#textLight)">gr</text>

    <!-- Stylized "8" as glowing Infinity Loop / Twin Sound Reel (Wordplay: gr8 = great, 8 = infinity lo-fi loop) -->
    <g filter="url(#neonGlow)">
      <!-- Top Loop -->
      <path d="M 47 18.5
               C 51.2 18.5, 54.5 21, 54.5 24.5
               C 54.5 27.2, 53 29.2, 50.8 30.2
               C 53.6 31.2, 55.5 33.6, 55.5 37
               C 55.5 41.5, 51.8 44.5, 47 44.5
               C 42.2 44.5, 38.8 41.5, 38.8 37
               C 38.8 33.6, 40.8 31.2, 43.4 30.2
               C 41.4 29.2, 39.8 27.2, 39.8 24.5
               C 39.8 21, 42.8 18.5, 47 18.5 Z
               M 47 22
               C 45 22, 43.5 23.2, 43.5 24.8
               C 43.5 26.5, 45 27.8, 47 27.8
               C 49 27.8, 50.5 26.5, 50.5 24.8
               C 50.5 23.2, 49 22, 47 22 Z
               M 47 31.5
               C 44.5 31.5, 42.5 33.2, 42.5 36.5
               C 42.5 39.8, 44.5 41.5, 47 41.5
               C 49.5 41.5, 51.5 39.8, 51.5 36.5
               C 51.5 33.2, 49.5 31.5, 47 31.5 Z"
            fill="url(#amber8)"/>
      
      <!-- Audio Driver Center Core Points -->
      <circle cx="47" cy="24.8" r="1.3" fill="#ffffff"/>
      <circle cx="47" cy="36.5" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Sub-Brand Pill Badge: "VIZ" (gr8-viz for Visualizer) -->
    <g transform="translate(0, 0)">
      <!-- Glassmorphic Pill Container -->
      <rect x="13" y="47" width="38" height="11" rx="5.5"
            fill="url(#vizPill)"
            stroke="rgba(243, 156, 86, 0.45)"
            stroke-width="0.9"/>

      <!-- Audio Ticks (left of VIZ) -->
      <line x1="16.5" y1="52.5" x2="16.5" y2="52.5" stroke="#ffbe76" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="19" y1="50.8" x2="19" y2="54.2" stroke="#f39c56" stroke-width="1.3" stroke-linecap="round"/>

      <!-- "VIZ" Typography -->
      <text x="32" y="55.6"
            font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif"
            font-size="7.6"
            font-weight="800"
            letter-spacing="1.8"
            text-anchor="middle"
            fill="#ffbe76">VIZ</text>

      <!-- Audio Ticks (right of VIZ) -->
      <line x1="45" y1="50.8" x2="45" y2="54.2" stroke="#f39c56" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="47.5" y1="52.5" x2="47.5" y2="52.5" stroke="#ffbe76" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
